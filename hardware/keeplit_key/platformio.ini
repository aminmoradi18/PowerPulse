; KeepLit operator key: an ESP32-S3 with an SSD1306 OLED, two buttons, LEDs and a buzzer.
; It holds the radio key and signs every frame the gateway sends to the farms. No radio on this board.
; Build: pio run    Flash: pio run -t upload --upload-port <port>    Monitor: pio device monitor
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.10
  adafruit/Adafruit GFX Library@^1.11.10
