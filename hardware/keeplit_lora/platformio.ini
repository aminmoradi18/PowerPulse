; KeepLit LoRa node for an ESP32-S3 with an RFM96W (SX1278, 433 MHz).
; The same firmware runs on the gateway board (next to the laptop) and on the device board (in the "village").
; Build: pio run    Flash: pio run -t upload --upload-port <port>    Monitor: pio device monitor
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@^7.1.0
  adafruit/Adafruit NeoPixel@^1.12.0
